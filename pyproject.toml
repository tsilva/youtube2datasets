[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "youtube2datasets"
version = "0.1.0"
description = "Turn YouTube longplays into Hugging Face-ready image datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Codex" },
]
dependencies = [
  "datasets>=3.4.0",
  "Pillow>=12.3,<13",
  "riptube==0.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.16.2,<0.17",
]

[project.scripts]
youtube2datasets = "youtube2datasets.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube2datasets"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "aiohttp>=3.14.3",
  "idna>=3.15",
  "pygments>=2.20",
  "urllib3>=2.7",
  "yt-dlp>=2026.7.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
